[project]
name = "pakt"
dynamic = ["version"]
description = "Fast, efficient Plex-Trakt sync using batch API operations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MikeSiLVO"}
]
keywords = ["plex", "trakt", "sync", "media", "scrobble"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "httpx>=0.28.1",
    "plexapi>=4.18.3",
    "click>=8.5.0",
    "rich>=15.0.0",
    "pydantic>=2.14.1",
    "fastapi>=0.146.0",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "apscheduler>=3.11.3,<4",
    # not imported directly; floored past known CVEs
    "certifi>=2026.10.19",
    "h11>=0.16.0",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
tray = [
    "pystray>=0.19.5",
    "Pillow>=13.0.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[project.scripts]
pakt = "pakt.cli:main"

[project.urls]
Repository = "https://github.com/MikeSiLVO/pakt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pakt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pakt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
