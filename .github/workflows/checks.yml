name: Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  # Dependencies are declared as open floors, so a breaking release upstream lands
  # without any commit here. Installing fresh on a schedule is what surfaces it.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  checks:
    if: github.repository == 'MikeSiLVO/pakt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[tray,dev]" pyright

      - name: Ruff
        run: .venv/bin/python -m ruff check src/

      - name: Pyright
        run: .venv/bin/python -m pyright
