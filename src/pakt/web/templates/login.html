<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakt - Log in</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            --bg: #1a1a2e;
            --bg-card: #16213e;
            --accent: #2dd4bf;
            --accent-hover: #14b8a6;
            --text: #eee;
            --text-dim: #888;
            --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card { background: var(--bg-card); border-radius: 12px; padding: 2rem; width: 100%; max-width: 360px; }
        h1 { color: var(--accent); font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: var(--text-dim); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1rem; }
        code { color: var(--text); }
        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #000;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: var(--accent-hover); }
        .error { color: var(--error); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Pakt</h1>
        {% if not password_set %}
        <p>Set a password before opening Pakt from another device:</p>
        <p><code>pakt password</code></p>
        <p>In Docker: <code>docker-compose run --rm pakt pakt password</code></p>
        {% else %}
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
            <button type="submit">Log in</button>
        </form>
        {% endif %}
    </div>
</body>
</html>
